<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>McSing Cast Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    #player { width: 100%; height: 100%; }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #39ff14;
      font-family: sans-serif;
      z-index: 10;
    }
    #overlay h1 { font-size: 3rem; margin-bottom: 1rem; }
    #overlay p { font-size: 1.2rem; color: #aaa; }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>McSing</h1>
    <p>Ready to receive...</p>
  </div>
  <div id="player"></div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const overlay = document.getElementById('overlay');

    let ytPlayer = null;
    let pendingVideoId = null;

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      // If a load request arrived before the API was ready, play it now
      if (pendingVideoId) {
        createPlayer(pendingVideoId);
        pendingVideoId = null;
      }
    };

    function createPlayer(videoId) {
      overlay.classList.add('hidden');

      if (ytPlayer) {
        ytPlayer.loadVideoById(videoId);
        return;
      }

      ytPlayer = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          playsinline: 1,
        },
        events: {
          onReady: (e) => e.target.playVideo(),
          onError: (e) => {
            console.error('YouTube player error:', e.data);
            overlay.classList.remove('hidden');
          },
        },
      });
    }

    // Intercept LOAD messages and handle with YouTube IFrame instead
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        const videoId =
          request.media?.customData?.videoId ||
          request.media?.contentId;

        if (videoId) {
          if (window.YT && window.YT.Player) {
            createPlayer(videoId);
          } else {
            // API not ready yet — queue it
            pendingVideoId = videoId;
          }
          return null; // Tell CAF we are handling playback ourselves
        }

        return request; // Fall through for any non-YouTube media
      }
    );

    context.start();
  </script>
</body>
</html>
