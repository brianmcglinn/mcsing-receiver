<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>McSing Cast Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    #yt-player { width: 100%; height: 100%; }
    #drive-player {
      display: none;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #39ff14;
      font-family: sans-serif;
      z-index: 10;
    }
    #overlay h1 { font-size: 3rem; margin-bottom: 1rem; }
    #overlay p { font-size: 1.2rem; color: #aaa; }
    #overlay.hidden { display: none; }
    #ver { position: fixed; bottom: 12px; right: 16px; font-size: 0.9rem; color: #555; }
    #status { max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>McSing</h1>
    <p id="status">Ready to receive...</p>
    <p id="ver">receiver v2 (plex)</p>
  </div>
  <div id="yt-player"></div>
  <video id="drive-player" autoplay playsinline></video>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const overlay = document.getElementById('overlay');
    const drivePlayer = document.getElementById('drive-player');
    const NAMESPACE = 'urn:x-cast:com.brian.mcsing';

    let ytPlayer = null;
    let pendingVideoId = null;

    // Show what the receiver is doing on the TV (until the picture starts), so a failure is visible and not just black.
    function status(text) {
      document.getElementById('status').textContent = text;
      overlay.classList.remove('hidden');
    }

    // Tell the app (every connected sender) that the song ended or could not play, so its queue moves on.
    function tell(event) {
      try { context.sendCustomMessage(NAMESPACE, undefined, { event: event }); } catch (e) { console.error('tell failed', e); }
    }

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      if (pendingVideoId) {
        createYouTubePlayer(pendingVideoId);
        pendingVideoId = null;
      }
    };

    function createYouTubePlayer(videoId) {
      overlay.classList.add('hidden');
      drivePlayer.style.display = 'none';
      document.getElementById('yt-player').style.display = 'block';

      if (ytPlayer) {
        ytPlayer.loadVideoById(videoId);
        return;
      }

      ytPlayer = new YT.Player('yt-player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          playsinline: 1,
        },
        events: {
          onReady: (e) => e.target.playVideo(),
          onStateChange: (e) => {
            if (e.data === 0) tell('ended'); // YT.PlayerState.ENDED
          },
          onError: (e) => {
            console.error('YouTube player error:', e.data);
            overlay.classList.remove('hidden');
            tell('error');
          },
        },
      });
    }

    // A Plex song (a signed link to the video) or, for older apps, a Drive file: one <video> for both.
    function playDriveVideo(contentUrl) {
      let host = '';
      try { host = new URL(contentUrl).host; } catch (e) { host = 'bad address'; }
      status('Loading song from ' + host + '...');
      document.getElementById('yt-player').style.display = 'none';
      drivePlayer.style.display = 'block';

      drivePlayer.onplaying = () => overlay.classList.add('hidden');
      drivePlayer.onended = () => tell('ended');
      drivePlayer.onerror = () => {
        const err = drivePlayer.error;
        console.error('Video load error', err);
        status('Could not load the song (video error ' + (err ? err.code : '?') + (err && err.message ? ': ' + err.message : '') + ')');
        tell('error');
      };

      drivePlayer.src = contentUrl;
      drivePlayer.load();
      drivePlayer.play().catch((e) => {
        console.error('Video play() rejected:', e);
        status('Could not start the song (' + (e && e.name ? e.name : 'play rejected') + ')');
        tell('error');
      });
    }

    // Custom message handler — receives play/pause commands from the app
    context.addCustomMessageListener(NAMESPACE, (event) => {
      const command = event.data?.command;
      console.log('[McSing] Custom message received:', command);

      if (command === 'pause') {
        if (ytPlayer) ytPlayer.pauseVideo();
        if (drivePlayer) drivePlayer.pause();
      } else if (command === 'play') {
        if (ytPlayer) ytPlayer.playVideo();
        if (drivePlayer) drivePlayer.play();
      }
    });

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        const customData = request.media?.customData;
        const type = customData?.type;
        status('Got a song to play (' + (type || 'youtube') + ')...');

        if (type === 'plex' || type === 'drive') {
          const contentUrl = request.media?.contentUrl;
          if (contentUrl) {
            playDriveVideo(contentUrl);
          }
          return null;
        }

        const videoId = customData?.videoId || request.media?.contentId;
        if (videoId) {
          if (window.YT && window.YT.Player) {
            createYouTubePlayer(videoId);
          } else {
            pendingVideoId = videoId;
          }
          return null;
        }

        return request;
      }
    );

    context.start();
  </script>
</body>
</html>
